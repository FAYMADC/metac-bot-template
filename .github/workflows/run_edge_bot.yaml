name: EdgeBot — forecast on tournament questions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to forecast on"
        required: false
        default: "tournament"
        type: choice
        options:
          - tournament
          - minibench
          - metaculus_cup
          - test_questions
  schedule:
    # Every 20 minutes, offset off the hour so we are not competing with every
    # other bot that left the template cron untouched. Already-forecasted
    # questions are skipped, so re-running is cheap.
    - cron: "11,31,51 * * * *"

# One run at a time. Overlapping runs would double-forecast the same questions.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run EdgeBot
        run: |
          poetry run python edge_bot.py --mode "${{ github.event.inputs.mode || 'tournament' }}"
        env:
          # Flip to 'frontier' (repo Settings -> Variables) the moment
          # LLM credits land. No code change needed.
          EDGEBOT_TIER: ${{ vars.EDGEBOT_TIER || 'free' }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}

      - name: Upload forecast logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-logs-${{ github.run_id }}
          path: forecast_logs/
          if-no-files-found: ignore
          retention-days: 30
