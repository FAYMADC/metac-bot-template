name: EdgeBot — forecast on tournament questions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to forecast on"
        required: false
        default: "tournament"
        type: choice
        options:
          - tournament
          - minibench
          - metaculus_cup
          - test_questions
          - single
          - probe
  schedule:
    # Every 20 minutes, offset off the hour so we are not competing with every
    # other bot that left the template cron untouched. Runs with nothing new
    # to forecast exit in seconds and make zero LLM calls.
    - cron: "11,31,51 * * * *"

# GITHUB_TOKEN may call GitHub Models (free tier), and read the repo. Nothing else.
permissions:
  contents: read
  models: read

# One run at a time. Overlapping runs would double-forecast the same questions.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    # The bot stops itself at 40 minutes (EDGEBOT_RUN_BUDGET_MINUTES) and
    # exits cleanly; this is only a backstop.
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run EdgeBot
        run: |
          poetry run python edge_bot.py --mode "${{ github.event.inputs.mode || 'tournament' }}"
        env:
          # "auto" probes every backend each run and uses the best that
          # answers. Force a fixed setup via repo variable EDGEBOT_TIER.
          EDGEBOT_TIER: ${{ vars.EDGEBOT_TIER || 'auto' }}
          EDGEBOT_FREE_MODEL: ${{ vars.EDGEBOT_FREE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}

      - name: Upload forecast logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-logs-${{ github.run_id }}
          path: forecast_logs/
          if-no-files-found: ignore
          retention-days: 30
