name: EdgeBot — forecast on tournament questions

# Coverage: MiniBench questions are only open ~3 hours each, and GitHub's
# cron fires irregularly (in practice every few hours). So each scheduled run
# keeps polling Metaculus every 10 minutes for up to ~5h20m, which bridges the
# gaps between cron firings. If a run is already polling when the cron fires,
# the new run exits within seconds.
# Nothing here exits non-zero for normal conditions, so GitHub sends no mail.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to forecast on"
        required: false
        default: "tournament"
        type: choice
        options:
          - tournament
          - minibench
          - metaculus_cup
          - test_questions
          - single
          - probe
      loop_minutes:
        description: "Keep polling for new questions this many minutes (0 = one pass)"
        required: false
        default: "320"
  schedule:
    - cron: "17 * * * *"

# Read the repo and see whether another run of this workflow is active.
permissions:
  contents: read
  actions: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ github.event.inputs.mode || 'tournament' }}
      LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '320' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip if another EdgeBot run is already polling
        id: guard
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "$MODE" != "tournament" ] && [ "$MODE" != "minibench" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          older=$(gh run list -R "$GITHUB_REPOSITORY" --workflow run_edge_bot.yaml \
            --limit 30 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId < ${GITHUB_RUN_ID})] | length" \
            || echo 0)
          echo "Older active runs: ${older}"
          if [ "${older:-0}" -gt 0 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Another run is already polling; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.guard.outputs.active != 'true'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.active != 'true'
        with:
          python-version: "3.11"

      - name: Install poetry
        if: steps.guard.outputs.active != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache dependencies
        if: steps.guard.outputs.active != 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.guard.outputs.active != 'true'
        run: poetry install --no-interaction --no-root

      - name: Run EdgeBot
        id: bot
        if: steps.guard.outputs.active != 'true'
        run: |
          poetry run python edge_bot.py --mode "$MODE" --loop-minutes "$LOOP_MINUTES" --poll-minutes 10
        env:
          # "auto" probes every backend each cycle that has work and uses the
          # best that answers. Force a fixed setup via repo variable EDGEBOT_TIER.
          EDGEBOT_TIER: ${{ vars.EDGEBOT_TIER || 'auto' }}
          EDGEBOT_FREE_MODEL: ${{ vars.EDGEBOT_FREE_MODEL }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}

      - name: Upload forecast logs
        if: always() && steps.guard.outputs.active != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forecast-logs-${{ github.run_id }}
          path: forecast_logs/
          if-no-files-found: ignore
          retention-days: 30
